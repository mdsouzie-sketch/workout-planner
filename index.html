<html lang="en">
<head>
<meta charset="utf-8">

<title>Exercise Library & Programmer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAF7F2;--card:#fff;--ink:#1A1A1A;--muted:#6a6a6a;--accent:#B8956A;--rule:rgba(26,26,26,.12);--bg2:#f1ece3}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{--paper:#16161a;--card:#202026;--ink:#ecebe8;--muted:#9a9a9a;--rule:rgba(255,255,255,.14);--bg2:#26262d;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#16161a;--card:#202026;--ink:#ecebe8;--muted:#9a9a9a;--rule:rgba(255,255,255,.14);--bg2:#26262d;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--rule);background:var(--card);border-radius:6px;padding:5px 10px}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:#b3261e}
button:disabled{opacity:.35;cursor:default}
input,select,textarea{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:6px 8px;width:100%}
textarea{resize:vertical;min-height:56px}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--rule);flex-wrap:wrap;position:sticky;top:0;background:var(--paper);z-index:5}
header h1{font-size:15px;letter-spacing:4px;font-weight:300;text-transform:uppercase}
nav{display:flex;gap:4px}
nav button{border:0;background:none;padding:6px 12px;border-radius:6px}
nav button.on{background:var(--accent);color:#fff}
.sp{flex:1}
main{padding:20px;max-width:1300px;margin:0 auto}
.layout{display:grid;grid-template-columns:230px 1fr;gap:22px}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
.side h3,.sec-h{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin:14px 0 6px}
.side .f{display:flex;justify-content:space-between;width:100%;border:0;background:none;text-align:left;padding:5px 8px;border-radius:6px}
.side .f.on{background:var(--bg2);font-weight:600}
.seg{display:flex;flex-direction:column;gap:3px}.seg button{text-align:left;border:0;background:none;padding:5px 8px}.seg button.on{background:var(--accent);color:#fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:var(--c)}
.chip{display:inline-flex;align-items:center;font-size:11px;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);margin:0 4px 4px 0;white-space:nowrap}
.chip.tog{cursor:pointer;opacity:.45}.chip.tog.on{opacity:1;font-weight:600}
.chip .x{cursor:pointer;margin-left:6px;opacity:.7}
.group-h{font-family:Georgia,serif;font-style:italic;font-size:20px;margin:22px 0 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.group-h small{font:12px system-ui;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--c,var(--accent));border-radius:8px;padding:10px 12px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card b{display:block;margin-bottom:3px}
.meta{font-size:12px;color:var(--muted)}
.lvl{letter-spacing:1px;color:var(--accent);font-size:11px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar input[type=search]{max-width:320px}
.empty{color:var(--muted);padding:30px;text-align:center}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:20}
.modal{background:var(--paper);border-radius:12px;max-width:760px;width:100%;padding:20px;border:1px solid var(--rule)}
.modal h2{font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:22px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.row.one{grid-template-columns:1fr}
label.l{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.ladder{display:flex;gap:6px;align-items:stretch;overflow-x:auto;padding:8px;background:var(--bg2);border-radius:8px;margin-bottom:14px}
.lcol{display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:140px}
.lcol .h{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-align:center}
.lnode{border:1px solid var(--rule);background:var(--card);border-radius:6px;padding:5px 8px;font-size:12px;text-align:center;cursor:pointer}
.lnode.cur{background:var(--accent);color:#fff;border-color:var(--accent);cursor:default}
.larr{align-self:center;color:var(--accent)}
.picker{position:relative}
.pickres{position:absolute;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--rule);border-radius:6px;z-index:3;max-height:200px;overflow:auto}
.pickres div{padding:5px 8px;cursor:pointer;font-size:13px}
.pickres div:hover{background:var(--bg2)}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* workouts */
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
th{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;background:var(--bg2)}
td{padding:6px 8px;border-top:1px solid var(--rule);vertical-align:middle}
td input{padding:3px 6px;width:70px}
td.nm{min-width:200px}
.wl{display:flex;gap:6px;margin-bottom:6px}
.wl button{flex:1;text-align:left}
.wl button.on{background:var(--bg2);border-color:var(--accent);font-weight:600}
.swap{background:var(--bg2);font-size:12px;padding:6px 8px}
.swap button{margin:2px 4px 2px 0}
.trow{display:flex;gap:10px;padding:8px;border:1px solid var(--rule);border-radius:8px;background:var(--card);align-items:center;margin-bottom:6px}
.trow input[type=color]{width:34px;height:28px;padding:1px}
/* workout builder sidebar */
.wb{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start}
@media(max-width:1000px){.wb{grid-template-columns:1fr}}
.exsb{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px}
.sbh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sbseg{display:flex;gap:4px}.sbseg button{flex:1;padding:4px 6px}
.sbseg button.on,.sbmode button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sbmode{float:right;text-transform:none;letter-spacing:0}.sbmode button{padding:0 7px;font-size:11px}
.sbsel{display:grid;gap:6px;margin:8px 0}.sbrange{display:flex;align-items:center;gap:6px;font-size:12px}.sbrange select{width:auto}
.sbg{margin-top:4px}.sbgh{display:flex;justify-content:space-between;width:100%;border:0;background:var(--bg2);padding:6px 8px;border-radius:6px;text-align:left;font-weight:600}
.sbrow{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 4px;border-bottom:1px solid var(--rule);cursor:grab}.sbrow:hover{background:var(--bg2)}
.sbn{min-width:0}.sbn b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis}.sbmore{width:100%;margin-top:4px}
.wzone{min-height:120px;border-radius:8px;overflow-x:auto}.wzone.over{outline:2px dashed var(--accent);outline-offset:2px}
/* blocks */
.xr td:first-child{border-left:4px solid var(--g,transparent)}
.gc{white-space:nowrap;width:50px}.grab{cursor:grab;color:var(--muted);font-size:16px;padding:0 4px;user-select:none}
tr.blk td{background:color-mix(in srgb,var(--bc,var(--accent)) 16%,var(--bg2));border-top:3px solid var(--bc,var(--accent));border-left:8px solid var(--bc,var(--accent));cursor:pointer}
tr.blk.act td{box-shadow:inset 0 0 0 2px var(--bc,var(--accent))}
.bh1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bnum{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:50%;background:var(--bc);color:#fff;font-weight:700}
.bt{flex:1 1 220px;min-width:160px;font-size:16px;font-weight:700}
.bl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
td input.bm{width:120px}td input.bff,.bff{width:84px}select.bf{width:auto}
.bsum{margin-left:auto}.bctl{display:flex;gap:6px;align-items:center}
td input.bcol{width:34px;height:30px;padding:1px}
.bn{margin-top:8px;min-height:60px;width:100%}
.npre{margin-top:6px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xr td:first-child{border-left:8px solid var(--g,transparent)}
.gb{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:4px;padding:0 6px;margin-right:6px;background:var(--gc,#888)}
.grab{font-size:22px;padding:2px 6px;touch-action:none;cursor:grab}
.xr td.gc,.xr td.nm,.xr td:nth-child(2){cursor:grab;user-select:none}tr.blk td{user-select:none}tr.blk td input,tr.blk td textarea{user-select:text}
.sbgrip{color:var(--muted);cursor:grab;padding:0 6px 0 2px;touch-action:none;font-size:18px}
.sbrow{user-select:none}.sbrow .sbn{flex:1;text-align:left}
.addto{margin:4px 0 8px}
.dghost{position:fixed;z-index:200;pointer-events:none;background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
body.dragging{user-select:none;cursor:grabbing}
tr.dt-above td{box-shadow:inset 0 3px 0 var(--accent)}
tr.dt-below td{box-shadow:inset 0 -3px 0 var(--accent)}
tr.dt-in td{outline:2px dashed var(--accent);outline-offset:-3px}
tr.newzone td{padding:14px;text-align:center;color:var(--muted);font-size:12px;border-top:1px dashed var(--rule)}
td input.grp{width:48px;text-transform:uppercase}
/* ===== modern look ===== */
:root{--paper:#F6F5F2;--card:#FFFFFF;--ink:#1B1B1F;--muted:#6E6E78;--accent:#B8956A;--rule:rgba(20,20,30,.08);--bg2:#EFEDE8;--r:12px;--shadow:0 1px 2px rgba(20,20,30,.05),0 6px 20px rgba(20,20,30,.06)}
:root[data-theme=dark]{--paper:#0F1013;--card:#17181D;--ink:#EDEDF0;--muted:#8E8F99;--rule:rgba(255,255,255,.07);--bg2:#1F2128;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#0F1013;--card:#17181D;--ink:#EDEDF0;--muted:#8E8F99;--rule:rgba(255,255,255,.07);--bg2:#1F2128;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35)}}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss03"}
input,select,textarea,button{font-family:inherit}
/* buttons: soft fills instead of outlined boxes */
button{border:0;background:var(--bg2);border-radius:9px;padding:6px 12px;font-weight:500;transition:background .12s,color .12s,box-shadow .12s}
button:hover{background:color-mix(in srgb,var(--ink) 9%,var(--bg2))}
button.pri{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
button.pri:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
button.danger{color:#d0443a}
/* fields: tonal fill, accent ring on focus */
input,select,textarea{background:var(--bg2);border:1px solid transparent;border-radius:9px;padding:7px 10px;transition:background .12s,border-color .12s,box-shadow .12s}
input:hover,select:hover,textarea:hover{background:color-mix(in srgb,var(--ink) 6%,var(--bg2))}
input:focus,select:focus,textarea:focus{outline:0;background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
/* header */
header{padding:10px 24px;gap:12px;border-bottom:1px solid var(--rule);background:color-mix(in srgb,var(--paper) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
header h1{font-size:13px;font-weight:600;letter-spacing:.22em}
nav{gap:2px;background:var(--bg2);padding:3px;border-radius:11px}
nav button{background:transparent;padding:6px 16px;border-radius:9px;color:var(--muted)}
nav button:hover{color:var(--ink);background:transparent}
nav button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
details.menu{position:relative}
details.menu>summary{list-style:none;cursor:pointer;padding:6px 12px;border-radius:9px;background:var(--bg2);font-weight:500;user-select:none}
details.menu>summary::-webkit-details-marker{display:none}
details.menu[open]>summary{background:color-mix(in srgb,var(--ink) 10%,var(--bg2))}
details.menu .pop{position:absolute;right:0;top:calc(100% + 8px);min-width:280px;white-space:nowrap;background:var(--card);border-radius:14px;box-shadow:var(--shadow),0 0 0 1px var(--rule);padding:6px;display:flex;flex-direction:column;gap:1px;z-index:30}
details.menu .pop button{background:transparent;text-align:left;border-radius:8px;padding:8px 10px;font-weight:450}
details.menu .pop button:hover{background:var(--bg2)}
details.menu .pop hr{border:0;border-top:1px solid var(--rule);margin:4px 6px}
/* library */
.side h3,.sec-h{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.side .f{border-radius:9px;padding:6px 10px}.side .f:hover{background:var(--bg2)}.side .f.on{background:var(--bg2);color:var(--ink)}
.seg button{border-radius:9px}.seg button.on{background:var(--accent)}
.chip{border:0;background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 70%,var(--ink));font-weight:500;padding:2px 9px}
.group-h{font-family:inherit;font-style:normal;font-size:17px;font-weight:650;letter-spacing:-.01em;border-bottom:0;padding-bottom:0;margin:28px 0 12px}
.group-h small{font-size:12px;background:var(--bg2);padding:1px 8px;border-radius:99px}
.grid{gap:12px}
.card{border:0;border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;transition:transform .12s,box-shadow .12s;border-left:4px solid var(--c,var(--accent))}
.card:hover{transform:translateY(-2px)}
.card b{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.meta{font-size:12px}
.lvl{color:var(--accent)}
.bar input[type=search]{max-width:360px}
/* modal */
.ov{background:rgba(8,9,12,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal{border:0;border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.45);padding:26px}
.modal h2{font-family:inherit;font-style:normal;font-weight:650;font-size:22px;letter-spacing:-.02em}
label.l{font-size:11px;font-weight:600;letter-spacing:.06em}
.ladder{border-radius:14px}.lnode{border:0;background:var(--card);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.pickres{border:0;border-radius:12px;box-shadow:var(--shadow)}
/* workout rows as cards */
table{border-collapse:separate;border-spacing:0 8px;background:none;border:0;border-radius:0;overflow:visible}
th{background:none;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding:2px 12px 0}
td{border:0;padding:10px 12px}
tr.xr td{background:var(--card)}
tr.xr td:first-child{border-radius:14px 0 0 14px;border-left:6px solid var(--g,transparent)}
tr.xr td:last-child{border-radius:0 14px 14px 0}
tr.xr{filter:drop-shadow(0 1px 1px rgba(0,0,0,.08))}
tr.xr:hover td{background:color-mix(in srgb,var(--ink) 3%,var(--card))}
tr.xr td.nm b{font-size:15px;font-weight:600;letter-spacing:-.01em}
tr.xr td.nm .chip{font-size:11px}
td input{background:transparent;border:1px solid transparent;text-align:center;padding:6px 4px;border-radius:8px;font-variant-numeric:tabular-nums;font-weight:500}
td input:hover{background:var(--bg2)}
td input:focus{background:var(--card);border-color:var(--accent)}
td input[data-wf$=":note"]{text-align:left;color:var(--muted);width:100%;min-width:120px;font-weight:400}
td input.grp{opacity:.55;width:48px}
.grab{opacity:.3;transition:opacity .12s}tr:hover .grab,.sbrow:hover .sbgrip{opacity:1}
tr.xr td.noprint button{background:transparent;opacity:.35;padding:4px 8px;border-radius:8px}
tr.xr:hover td.noprint button{opacity:.9}tr.xr td.noprint button:hover{background:var(--bg2);opacity:1}
tr.xr td.noprint button.danger{color:#d0443a}
td input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);vertical-align:middle;margin-left:2px}
.gb{border-radius:6px;font-size:10px;letter-spacing:.02em;padding:1px 7px;margin-right:8px;vertical-align:1px}
/* block headers */
tr.blk td{border-radius:16px;border:0;border-left:0;border-top:0;padding:14px 18px;background:color-mix(in srgb,var(--bc,var(--accent)) 13%,var(--card));box-shadow:inset 6px 0 0 var(--bc,var(--accent)),var(--shadow)}
tr.blk.act td{box-shadow:inset 6px 0 0 var(--bc,var(--accent)),0 0 0 2px var(--bc,var(--accent)),var(--shadow)}
.bnum{width:32px;height:32px;font-size:14px;box-shadow:0 2px 6px color-mix(in srgb,var(--bc) 50%,transparent)}
td input.bt{background:transparent;border:1px solid transparent;text-align:left;font-size:18px;font-weight:650;letter-spacing:-.015em;padding:4px 8px}
td input.bt:hover{background:color-mix(in srgb,var(--bc) 10%,transparent)}
td input.bt:focus{background:var(--card)}
.bl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
td input.bm,td input.bff{background:color-mix(in srgb,var(--bc) 12%,transparent);border-radius:99px;padding:4px 12px;font-weight:500;text-align:center}
td input.bm:focus,td input.bff:focus{background:var(--card)}
select.bf{background:color-mix(in srgb,var(--bc) 12%,transparent);border-radius:99px;padding:5px 12px;font-weight:500}
.bctl button{background:transparent;opacity:.7;padding:5px 9px}.bctl button:hover{background:color-mix(in srgb,var(--bc) 14%,transparent);opacity:1}
td input.bcol{padding:0;width:26px;height:26px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--rule);background:none}
td input.bcol::-webkit-color-swatch-wrapper{padding:0}td input.bcol::-webkit-color-swatch{border:0;border-radius:50%}
.bn{background:color-mix(in srgb,var(--bc) 8%,transparent);border-radius:12px;padding:10px 12px;line-height:1.5}
.npre{padding:2px 8px;border-radius:8px}.npre:hover{background:color-mix(in srgb,var(--bc) 10%,transparent)}
tr.newzone td{background:none;border:1.5px dashed var(--rule);border-radius:14px;color:var(--muted);padding:16px}
tr.dt-above td{box-shadow:inset 0 3px 0 var(--accent)}
tr.dt-below td{box-shadow:inset 0 -3px 0 var(--accent)}
tr.dt-in td{outline:2px solid var(--accent);outline-offset:-2px}
.swap{border-radius:12px;background:var(--bg2);padding:10px 14px}
.wzone{overflow-x:auto;padding:2px 4px 8px}
input.wt{background:transparent;font-size:22px;font-weight:650;letter-spacing:-.02em;padding:4px 10px;max-width:460px}
input.wt:hover{background:var(--bg2)}input.wt:focus{background:var(--card)}
/* sidebar panel */
.exsb{border:0;border-radius:18px;box-shadow:var(--shadow);padding:16px}
.sbh b{font-size:15px;font-weight:650;letter-spacing:-.01em}
.sbseg{background:var(--bg2);padding:3px;border-radius:11px}.sbseg button{background:transparent;border-radius:9px;color:var(--muted)}

.viewseg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}.viewseg button{border:0;border-radius:0;padding:6px 12px;background:transparent;font-size:12px}.viewseg button.on{background:var(--bg2);box-shadow:inset 0 -2px 0 var(--gold)}
#libsort{width:auto;font-size:12px}
.llist{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.lrow{display:grid;grid-template-columns:30px minmax(0,2fr) 60px minmax(0,1fr) 70px 54px;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--rule);cursor:pointer;border-left:3px solid var(--c,var(--gold))}
.lrow:last-child{border-bottom:0}.lrow:hover{background:var(--bg2)}.lrow b{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media (max-width:700px){.lrow{grid-template-columns:28px 1fr 54px}.lrow .ltr,.lrow .lmv,.lrow .lln{display:none}}

.cmdi.on,.cmdi:hover{background:var(--bg2)}.cmdi.on{box-shadow:inset 3px 0 0 var(--gold)}

  const have=new Set(S.exercises.map(e=>normKey(e.name))),added=[];

    const k=normKey(name);if(have.has(k))return;have.add(k);
    const ex={id:uid('e_'),name,traits:tr.split(',').map(x=>'t_'+x),pattern,equipment,level,cues,notes,prog:[],move,phase,src:'free-exercise-db'};

  applyVariations();
  return added;}

function showCoverage(){
  const have=new Set(S.exercises.map(e=>normKey(e.name)));
  const vars=new Set();S.exercises.forEach(e=>(e.variations||[]).forEach(v=>vars.add(normKey(v))));
  const L={d:'Already in your library (duplicate of an existing exercise)',v:'Merged as a variation of another exercise',i:'Imported as its own exercise',m:'Merge tier: not imported yet',h:'On hold: not imported yet'};
  const st={};Object.keys(L).forEach(k=>st[k]={n:0,ok:0,miss:[]});
  TBX_ALL.forEach(([name,c,m])=>{const k=normKey(name),ok=have.has(k)||vars.has(k)||(m&&have.has(normKey(m)));const o=st[c];o.n++;if(ok)o.ok++;else o.miss.push(name);});
  const tot=TBX_ALL.length,found=Object.values(st).reduce((a,o)=>a+o.ok,0);
  const tbx=S.exercises.filter(e=>e.src==='TeamBuildr').length;
  $('#modalHost').innerHTML=`<div class="ov" data-ovclose><div class="modal"><h2>TeamBuildr coverage: ${found} of ${tot} entries are in this library</h2>
  <p class="meta" style="margin-bottom:10px">${tbx} exercises here came from the TeamBuildr import. If the Imported row shows fewer than its total, click “Add TeamBuildr exercises” in the header.</p>
  <table><thead><tr><th>What happened to it</th><th>In library</th><th>Total</th></tr></thead><tbody>${Object.keys(L).filter(k=>st[k].n).map(k=>`<tr><td>${esc(L[k])}</td><td>${st[k].ok}</td><td>${st[k].n}</td></tr>`).join('')}</tbody></table>
  ${['i','v','d','m','h'].filter(k=>st[k].miss.length).map(k=>`<div class="sec-h">Not found: ${esc(L[k])} (${st[k].miss.length})</div><div class="meta">${st[k].miss.slice(0,400).map(esc).join(' · ')}${st[k].miss.length>400?' …':''}</div>`).join('')}
  <div class="foot"><button class="pri" data-mclose>Close</button></div></div></div>`;}

function setSync(txt){const b=document.querySelector('#btnSync');if(!b)return;const k=/^synced/.test(txt)?'ok':/offline|error/.test(txt)?'bad':'warn';b.innerHTML='<i class="sdot '+k+'"></i><span>'+esc(txt)+'</span>';b.title='Cloud sync: '+txt+'. Click to sync now.';}
async function sbFetch(path,opt={}){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{...opt,headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'x-wp-key':cloudKey(),'Content-Type':'application/json',...(opt.headers||{})}});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,200));
  if(r.status===204)return null;
  try{return await r.json();}catch(e){return null;}
}
async function sbAll(table){let out=[],off=0;for(;;){const rows=await sbFetch(`${table}?select=id,data&order=id&limit=1000&offset=${off}`);out=out.concat(rows||[]);if(!rows||rows.length<1000)break;off+=1000;}return out;}
function hashState(){const t=JSON.stringify(Object.assign({t:S.traits,e:S.exercises,w:S.workouts},(S.templates&&S.templates.length)?{p:S.templates}:{},(S.plan&&Object.keys(S.plan).length)?{q:S.plan}:{},(S.meta&&(S.meta.fav.length||S.meta.recent.length||S.meta.filters.length))?{m:S.meta}:{}));let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36)+'-'+t.length;}
function cloudSchedule(){if(!cloudReady)return;clearTimeout(cloudTimer);setSync('unsaved\u2026');cloudTimer=setTimeout(cloudPush,1500);}
async function cloudLoad(){
  setSync('connecting\u2026');
  try{
    const [t,e,w]=await Promise.all(['wp_traits','wp_exercises','wp_workouts'].map(sbAll));
    let last=null;try{last=localStorage.getItem('wp_cloud_hash');}catch(x){}
    let useRemote=false;
    if(e.length){
      if(!last)useRemote=confirm('The cloud library has '+e.length+' exercises and this browser has '+S.exercises.length+'.\n\nOK = load the cloud copy here.\nCancel = replace the cloud copy with this browser\u2019s copy.');
      else useRemote=last===hashState();           // unsynced local edits win; otherwise the cloud copy is current
    }
    cloudSnap.traits=new Map(t.map(r=>[r.id,JSON.stringify(r.data)]));
    cloudSnap.exercises=new Map(e.map(r=>[r.id,JSON.stringify(r.data)]));
    cloudSnap.workouts=new Map(w.map(r=>[r.id,JSON.stringify(r.data)]));
    if(useRemote){
      S={traits:t.map(r=>r.data),exercises:e.map(r=>r.data),workouts:w.map(r=>r.data).filter(x=>!x.tpl&&!x.plan&&!x.meta),meta:(w.map(r=>r.data).find(x=>x.meta)||{}),templates:w.map(r=>r.data).filter(x=>x.tpl),plan:Object.fromEntries(w.map(r=>r.data).filter(x=>x.plan).map(x=>[x.key,x.days]))};
      if(!S.traits.length)S.traits=seed().traits;
      migrate();applyVariations();enhanceTbx();
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(x){}

    await cloudPush();

}
async function cloudPush(){
  if(!cloudReady)return;
  if(cloudBusy){cloudAgain=true;return;}
  cloudBusy=true;setSync('saving\u2026');
  try{
    do{
      cloudAgain=false;
      const cur={traits:S.traits,exercises:S.exercises,workouts:S.workouts.concat(S.templates||[],Object.entries(S.plan||{}).map(([k,d])=>({id:'pl_'+k,plan:true,key:k,days:d})),(S.meta&&(S.meta.fav.length||S.meta.recent.length||S.meta.filters.length))?[{id:'meta_user',meta:true,fav:S.meta.fav,recent:S.meta.recent,filters:S.meta.filters}]:[])};
      for(const [k,table] of Object.entries(SB_TABLES)){
        const snap=cloudSnap[k],ids=new Set(),up=[],now=new Date().toISOString();
        cur[k].forEach(item=>{ids.add(item.id);const j=JSON.stringify(item);if(snap.get(item.id)!==j){const row={id:item.id,data:item,updated_at:now};if(k==='exercises')row.name=item.name;up.push({row,j});}});
        const del=[...snap.keys()].filter(id=>!ids.has(id));
        for(let i=0;i<up.length;i+=150){const chunk=up.slice(i,i+150);
          await sbFetch(table+'?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(chunk.map(c=>c.row))});
          chunk.forEach(c=>snap.set(c.row.id,c.j));}
        for(let i=0;i<del.length;i+=50){const chunk=del.slice(i,i+50);
          await sbFetch(table+'?id=in.('+chunk.join(',')+')',{method:'DELETE',headers:{Prefer:'return=minimal'}});chunk.forEach(id=>snap.delete(id));}
      }
      try{localStorage.setItem('wp_cloud_hash',hashState());}catch(x){}
    }while(cloudAgain);
    try{localStorage.setItem('wp_last_sync',new Date().toISOString());}catch(x){}
    setSync('synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
  }catch(err){setSync('error (click to retry)');console.warn('cloud save failed',err);}

}

/* ---------- passcode gate: the page stays locked until the passcode is entered; the cloud tables also require a key derived from it ---------- */
const PASS_HASH='5e69fb70d3b8e3f1be886f734877a6cf64a1c0dfb11db889fb367cc7c2b1b6a8';
async function sha256Hex(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function cloudKey(){try{return localStorage.getItem('wp_key')||'';}catch(e){return '';}}
async function gateThen(fn){
  let ok=false;try{ok=localStorage.getItem('wp_unlock')===PASS_HASH&&!!localStorage.getItem('wp_key');}catch(e){}
  if(ok){fn();return;}
  const g=document.createElement('div');g.id='gate';g.style.cssText='position:fixed;inset:0;z-index:99;background:var(--paper);display:flex;align-items:center;justify-content:center';
  g.innerHTML='<div style="width:min(340px,90vw);text-align:center"><h1 style="font-size:15px;letter-spacing:4px;font-weight:300;text-transform:uppercase;margin-bottom:14px">Exercise Library</h1><input type="password" id="gpw" placeholder="Passcode" autocomplete="current-password" style="margin-bottom:8px"><button class="pri" id="gbtn" style="width:100%">Unlock</button><div class="meta" id="gmsg" style="margin-top:8px;min-height:18px"></div></div>';
  document.body.appendChild(g);
  const go=async()=>{const pw=document.getElementById('gpw').value;let h='';
    try{h=await sha256Hex(pw);}catch(e){document.getElementById('gmsg').textContent='This browser cannot check passcodes here. Open the page over https or from a local file.';return;}
    if(h===PASS_HASH){try{localStorage.setItem('wp_unlock',h);localStorage.setItem('wp_key',await sha256Hex('wp:'+pw));}catch(e){}g.remove();fn();}
    else document.getElementById('gmsg').textContent='Wrong passcode.';};
  document.getElementById('gbtn').onclick=go;
  document.getElementById('gpw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  document.getElementById('gpw').focus();
}

// Merge starter additions into the current library by name. Never touches existing
// exercises, and only adds links that involve a newly added exercise.
function mergeStarter(){
  const F=seed(),have=new Map(S.exercises.map(e=>[e.name,e]));
  F.traits.forEach(t=>{if(!trById(t.id))S.traits.push(t);});
  const fresh=F.exercises.filter(e=>!have.has(e.name)),isNew=new Set(fresh.map(e=>e.name));
  const idToName=new Map(F.exercises.map(e=>[e.id,e.name]));
  fresh.forEach(e=>{const c={...e,prog:[]};S.exercises.push(c);have.set(c.name,c);});
  F.exercises.forEach(f=>f.prog.forEach(pid=>{
    const a=have.get(f.name),b=have.get(idToName.get(pid));
    if(a&&b&&(isNew.has(f.name)||isNew.has(b.name))&&!a.prog.includes(b.id))a.prog.push(b.id);}));
  applyVariations();
  return fresh.length;
}

function sbMatch(e){

  else if(f.by==='move'){gs=MOVES.map(m=>({id:m.id,name:m.name,color:m.color}));key=e=>e.move||'';}

  if(f.list){gs=[{id:'all',name:f.list==='fav'?'Favourites':'Recently used',color:'var(--accent)'}];key=()=>'all';}
  const out=gs.map(g=>({...g,items:[]})),idx=new Map(out.map(g=>[g.id,g]));

  list.forEach(e=>(idx.get(key(e))||other).items.push(e));

  if(o.orient==='portrait'){let f=0;for(let k=mxP(o);k>=.4;k-=.02){if(pages(k)<=1){f=k;break;}}
    if(f){_fit={z:Math.round(f*100)/100,pages:1};host.remove();return _fit.z;}}

function ladder(id){

  const cols={0:[id]};const seen=new Set([id]);

    front.forEach(x=>fn(x).forEach(y=>{if(!seen.has(y)){seen.add(y);nxt.push(y);}}));
    if(nxt.length)cols[d]=nxt;front=nxt;}};
  walk(1,progOf);walk(-1,regOf);
  return Object.keys(cols).map(Number).sort((a,b)=>a-b).map(k=>({k,ids:cols[k]}));
}

function webBuild(){
  const W=ui.web,c=exById(W.c),nodes=[],edges=[],idx=new Map();
  const addN=o=>{idx.set(o.id,o);nodes.push(o);return o;};
  const mk=(e,kind,px)=>{const nm=e.name.length>27?e.name.slice(0,26)+'\u2026':e.name;
    return addN({id:e.id,kind,name:nm,full:e.name,w:Math.min(200,Math.max(90,nm.length*7.3+26))*(kind==='cur'?1.2:1),h:kind==='cur'?52:42,lv:e.level,col:(trById(e.traits[0])||{}).color||'#888',px,x:0,y:0});};
  const hop=new Map([[c.id,0]]),pos=new Map([[c.id,0]]);let front=[c.id];
  for(let d=1;d<=W.depth&&front.length;d++){const nx=[];
    for(const id of front){
      for(const y of progOf(id))if(!hop.has(y)&&hop.size<70){hop.set(y,d);pos.set(y,pos.get(id)+1);nx.push(y);}
      for(const y of regOf(id))if(!hop.has(y)&&hop.size<70){hop.set(y,d);pos.set(y,pos.get(id)-1);nx.push(y);}
    }front=nx;}
  hop.forEach((d,id)=>mk(exById(id),id===c.id?'cur':'chain',pos.get(id)));
  const hubs=[];
  if(W.rel==='both'||W.rel==='trait')c.traits.slice(0,3).forEach(t=>{const tr=trById(t);if(tr)hubs.push({id:'h:t:'+t,kind:'hub',name:tr.name,col:tr.color,test:e=>e.traits.includes(t)});});
  if((W.rel==='both'||W.rel==='move')&&c.move){const m=MOVES.find(x=>x.id===c.move);hubs.push({id:'h:m:'+c.move,kind:'hub',name:c.move,col:m?m.color:'#888',test:e=>e.move===c.move});}
  hubs.forEach(h=>addN({id:h.id,kind:'hub',name:h.name,col:h.col,w:Math.max(76,h.name.length*7.2+28),h:26,x:0,y:0,px:null}));
  const seen=new Set(),addE=(a,b,t,col)=>{const k=a+'>'+b;if(seen.has(k))return;seen.add(k);edges.push({a,b,t,col});};
  hubs.forEach(h=>nodes.forEach(n=>{if((n.kind==='chain'||n.kind==='cur')&&hop.get(n.id)<=1&&h.test(exById(n.id)))addE(n.id,h.id,'attr',h.col);}));
  hubs.forEach(h=>{
    const cand=S.exercises.filter(e=>!hop.has(e.id)&&!!e.phase===!!c.phase&&h.test(e))
      .map(e=>({e,s:hubs.filter(q=>q.test(e)).length*10-Math.abs(e.level-c.level)*2+(e.pattern&&e.pattern===c.pattern?3:0)+((e.prog.length||regOf(e.id).length)?1:0)}))
      .sort((a,b)=>b.s-a.s||a.e.name.localeCompare(b.e.name));
    let n=0;for(const q of cand){if(n>=W.k)break;if(!idx.has(q.e.id))mk(q.e,'rel',null);addE(q.e.id,h.id,'attr',h.col);n++;}
  });
  nodes.forEach(n=>{if(n.kind==='hub')return;progOf(n.id).forEach(y=>{if(idx.has(y)&&idx.get(y).kind!=='hub')addE(n.id,y,'prog');});});
  // layout: force simulation, progression flows left (easier) to right (harder)
  const hn=nodes.filter(n=>n.kind==='hub'),en=nodes.filter(n=>n.kind!=='hub');
  hn.forEach((h,i)=>{h.x=(i-(hn.length-1)/2)*280;h.y=(i%2?1:-1)*200;});
  en.forEach((n,i)=>{const a=i*2.4;if(n.px!=null){n.x=n.px*230;n.y=((i%5)-2)*80;}else{n.x=Math.cos(a)*320+(i%3)*10;n.y=Math.sin(a)*320;}});
  const cur=idx.get(c.id);cur.x=0;cur.y=0;
  const N=nodes.length;
  for(let it=0;it<360;it++){const al=Math.max(.05,1-it/360);
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=nodes[i],b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y;if(!dx&&!dy){dx=.1;dy=.1;}
      const rx=(a.w+b.w)/2+18,ry=(a.h+b.h)/2+16,q=Math.hypot(dx/rx,dy/ry);
      if(q<2.4){const dist=Math.hypot(dx,dy)||1,f=(2.4-q)*(q<1?30:9)*al,ux=dx/dist,uy=dy/dist;a.x-=ux*f;a.y-=uy*f;b.x+=ux*f;b.y+=uy*f;}}
    edges.forEach(e=>{const a=idx.get(e.a),b=idx.get(e.b);const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
      const L=e.t==='prog'?190:150,k=e.t==='prog'?.05:.012,f=(d-L)*k*al,ux=dx/d,uy=dy/d;a.x+=ux*f;a.y+=uy*f;b.x-=ux*f;b.y-=uy*f;});
    en.forEach(n=>{if(n.px!=null)n.x+=(n.px*230-n.x)*.07;else{n.x*=1-.004*al;n.y*=1-.004*al;}});
    hn.forEach((h,i)=>{h.y+=((i%2?1:-1)*200-h.y)*.03;});
    cur.x=0;cur.y=0;
  }

}

/* ---------- touch tooltips and keyboard-aware scrolling ---------- */
(function(){let tm=null,tip=null,shown=false,sx=0,sy=0;
  const hide=()=>{clearTimeout(tm);if(tip){tip.remove();tip=null;}};
  document.addEventListener('pointerdown',ev=>{if(ev.pointerType==='mouse'||!ev.target.closest)return;const el=ev.target.closest('[title]');if(!el||el.closest('.grab,.sbgrip')||!el.getAttribute('title'))return;
    sx=ev.clientX;sy=ev.clientY;clearTimeout(tm);tm=setTimeout(()=>{shown=true;tip=document.createElement('div');tip.id='tip';tip.textContent=el.getAttribute('title');document.body.appendChild(tip);
      const r=el.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(innerWidth-tip.offsetWidth-8,r.left+r.width/2-tip.offsetWidth/2))+'px';tip.style.top=Math.max(8,r.top-tip.offsetHeight-8)+'px';},450);});
  document.addEventListener('pointermove',ev=>{if(tm&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8)hide();});
  const up=()=>{clearTimeout(tm);if(tip)setTimeout(hide,1400);};document.addEventListener('pointerup',up);document.addEventListener('pointercancel',hide);
  document.addEventListener('click',ev=>{if(shown){shown=false;ev.stopPropagation();ev.preventDefault();}},true);
  const want=el=>el&&el.matches&&el.matches('.qa,#sbq,#webq,#q,input[data-wf],.bt,#f_name');
  const toView=el=>{if(!document.documentElement.classList.contains('touch'))return;setTimeout(()=>{try{el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}},320);};
  document.addEventListener('focusin',ev=>{if(want(ev.target))toView(ev.target);});
  if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const a=document.activeElement;if(want(a))toView(a);});
})();

function qctx(){const lk=new Set(),used=new Set();S.exercises.forEach(e=>{if(e.prog.length)lk.add(e.id);e.prog.forEach(p=>lk.add(p));});
  S.workouts.forEach(w=>w.items.forEach(i=>{if(i.ex)used.add(i.ex);}));return {lk,used,rec:new Map(S.meta.recent.map((x,i)=>[x,i])),fav:new Set(S.meta.fav)};}
function qScore(e,c){let q=0;if(e.cues)q+=2;if(e.move||e.phase)q+=1;if(e.equipment)q+=1;if(e.traits.length)q+=1;if(c.lk.has(e.id))q+=3;if(c.used.has(e.id))q+=3;if(e.media)q+=1;if(c.rec.has(e.id))q+=2;if(e.name.length<4)q-=2;return q;}
/* link wizard */
function lwCands(e,dir,lk){
  const want=dir==='up'?e.level+1:e.level-1;if(want<1||want>5)return [];
  const toks=new Set(e.name.toLowerCase().split(/[^a-z0-9]+/).filter(t=>t.length>2));
  const taken=new Set([e.id,...e.prog]);S.exercises.forEach(x=>{if(x.prog.includes(e.id))taken.add(x.id);});
  return S.exercises.filter(x=>!taken.has(x.id)&&!!x.phase===!!e.phase&&x.level===want&&(!e.move||x.move===e.move))
    .map(x=>({x,s:x.traits.filter(t=>e.traits.includes(t)).length*3+(e.pattern&&x.pattern===e.pattern?2:0)+x.name.toLowerCase().split(/[^a-z0-9]+/).filter(t=>toks.has(t)).length*2+(lk.has(x.id)?1:0)}))
    .sort((a,b)=>b.s-a.s||a.x.name.localeCompare(b.x.name)).slice(0,6).map(o=>o.x);
}
function lwStart(){
  const c=qctx();const ids=S.exercises.filter(e=>!c.lk.has(e.id)&&!e.phase).sort((a,b)=>(!a.move-!b.move)||(qScore(b,c)-qScore(a,c))||a.level-b.level||a.name.localeCompare(b.name)).map(e=>e.id);
  if(!ids.length){toast('Every training exercise already has a link.',false);return;}
  ui.lw={ids,i:0,up:new Set(),down:new Set(),total:ids.length,saved:0};lwDraw();
}
function lwDraw(){
  const L=ui.lw;if(!L)return;const e=exById(L.ids[L.i]);
  if(!e){closeModal();ui.lw=null;render();toast('Link wizard finished.',false);return;}
  const c=qctx(),up=lwCands(e,'up',c.lk),dn=lwCands(e,'down',c.lk);
  const chipsFor=(dir,cands,set)=>{const all=[...cands];[...set].forEach(id=>{if(!all.some(x=>x.id===id)&&exById(id))all.push(exById(id));});
    return all.length?all.map(x=>`<span class="chip tog ${set.has(x.id)?'on':''}" style="--c:#c9a66b" data-lwt="${dir}:${x.id}">${esc(x.name)} <span class="meta" style="opacity:.8">${lvl(x.level)}</span></span>`).join(''):'<span class="meta">No suggestions at that level.</span>';};
  $('#modalHost').innerHTML=`<div class="ov"><div class="modal" style="max-width:720px"><div class="meta">Link wizard \u00b7 ${L.i+1} of ${L.total} \u00b7 ${L.saved} saved</div>
    <h2>${esc(e.name)}</h2><div>${chips(e)}</div><div class="meta" style="margin:4px 0 12px">${esc([e.move,e.pattern,e.equipment].filter(Boolean).join(' \u00b7 '))} \u00b7 <span class="lvl">${lvl(e.level)}</span></div>
    <div class="row"><div><label class="l">Easier options (level ${Math.max(1,e.level-1)})</label><div>${chipsFor('down',dn,L.down)}</div>
      <div class="picker"><input data-lwq="down" placeholder="Search another easier option\u2026" autocomplete="off"><div class="pickres" id="lwr_down" hidden></div></div></div>
     <div><label class="l">Harder options (level ${Math.min(5,e.level+1)})</label><div>${chipsFor('up',up,L.up)}</div>
      <div class="picker"><input data-lwq="up" placeholder="Search another harder option\u2026" autocomplete="off"><div class="pickres" id="lwr_up" hidden></div></div></div></div>
    <div class="foot"><button data-lwgo="close" style="margin-right:auto">Close</button><button data-lwgo="back" ${L.i?'':'disabled'}>Back</button><button data-lwgo="skip">Skip</button><button class="pri" data-lwgo="save">Save and next</button></div></div></div>`;
}

function cmdItems(q){
  q=q.trim().toLowerCase();const out=[];const go=tab=>()=>{ui.tab=tab;ui.drawer=null;render();};
  const act=(label,sub,run)=>({label,sub,run,kind:'Action'});

    act('New workout','Create an empty workout',()=>{const w={id:uid('w_'),name:'New workout',items:[]};S.workouts.push(w);ui.wid=w.id;ui.tab='workouts';save();render();}),
    act('Go to Library','',go('library')),act('Go to Workouts','',go('workouts')),act('Go to Week planner','',go('week')),act('Go to Web','',go('web')),act('Go to Traits','',go('traits')),
    act('Print this workout','Open the print dialog',()=>{ui.tab='workouts';render();showPrintDialog();}),
    act('Start link wizard','Link exercises that have no progressions',()=>lwStart()),
    act('Toggle theme','Cycle light, dark and auto',()=>$('#btnTheme').click()),
    act('Keyboard shortcuts','',()=>showKeys()),act('Replay the tour','',()=>tourCard(0)),
    act('Insert blocks from another workout\u2026','',()=>{ui.tab='workouts';render();copyModal();}),
    act('Export JSON backup','',()=>$('#btnExport').click())];
  if(!q){acts.slice(0,8).forEach(a=>out.push(a));
    S.meta.recent.slice(0,5).forEach(id=>{const e=exById(id);if(e)out.push({label:e.name,sub:'Recent exercise',kind:'Exercise',id,run:()=>{ui.drawer={id,n:null};render();}});});
    return out;}
  qaSearch(q).forEach(e=>out.push({label:e.name,sub:[e.phase?'Warm-up':'',e.move,lvl(e.level)].filter(Boolean).join(' \u00b7 '),kind:'Exercise',id:e.id,run:()=>{ui.drawer={id:e.id,n:null};render();}}));
  S.workouts.filter(w=>w.name.toLowerCase().includes(q)).slice(0,5).forEach(w=>out.push({label:w.name,sub:'Workout',kind:'Workout',run:()=>{ui.wid=w.id;ui.tab='workouts';render();}}));
  (S.templates||[]).filter(t=>t.name.toLowerCase().includes(q)).slice(0,4).forEach(t=>out.push({label:t.name,sub:'Template: insert into the workout',kind:'Template',run:()=>{ui.tab='workouts';insertTemplate(t.id);render();}}));
  acts.filter(a=>a.label.toLowerCase().includes(q)).forEach(a=>out.push(a));
  return out.slice(0,14);
}

  else if(d.mv){const[n,s]=d.mv.split(':').map(Number);const a=curW().items;[a[n],a[n+s]]=[a[n+s],a[n]];save();render();}
  else if(d.rm){pushUndo('Removed exercise');curW().items.splice(+d.rm,1);ui.swap=null;save();render();}
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='q'){ui.q=t.value;const p=t.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p);}
  else if(t.id==='sbq'){ui.sb.q=t.value;ui.sb.cap=60;sbRefresh();}
  else if(t.id==='addq'){ui.addQ=t.value;const p=t.selectionStart;render();const n=$('#addq');n.focus();n.setSelectionRange(p,p);}
  else if(t.id==='wname'){curW().name=t.value;save();}
  else if(t.dataset.tname){trById(t.dataset.tname).name=t.value;save();}
  else if(t.dataset.tcolor){trById(t.dataset.tcolor).color=t.value;save();}
  else if(t.dataset.bf){const[n,f]=t.dataset.bf.split(':');curW().items[+n][f]=t.value;save();}
  else if(t.dataset.wf){const[n,f]=t.dataset.wf.split(':');curW().items[+n][f]=f==='sets'?(+t.value||1):t.value;save();}
  else if(t.dataset.pick){
    const f=t.dataset.pick,q=t.value.trim().toLowerCase(),box=$('#pr_'+f);
    const r=q?S.exercises.filter(e=>e.id!==D.id&&!D[f].includes(e.id)&&e.name.toLowerCase().includes(q)).slice(0,8):[];
    box.hidden=!r.length;box.innerHTML=r.map(e=>`<div data-pickadd="${f}:${e.id}">${esc(e.name)} <span class="meta">${lvl(e.level)}</span></div>`).join('');
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='libsort'){ui.sort=t.value;render();return;}
  if(t.dataset.wkadd!==undefined){wkAdd(t.dataset.wkadd,t.value);return;}
  if(t.id==='cfsel'){ui.cf.wid=t.value;copyModal();return;}
  if(t.dataset.sel){t.checked?ui.sel.add(t.dataset.sel):ui.sel.delete(t.dataset.sel);renderKeep();}
  else if(t.dataset.bf&&/:(time|fmt|rounds|interval|color)$/.test(t.dataset.bf)){renderKeep();}
  else if(t.dataset.wf&&/:(sets|grp)$/.test(t.dataset.wf)){renderKeep();}
  else if(t.id==='grp'){ui.group=t.checked;render();}
  else if(t.id==='show'){ui.show=t.value;render();}
  else if(t.id==='wsel'){ui.wid=t.value;ui.swap=null;render();}
  else if(t.id==='sbmove'){ui.sb.move=t.value;ui.sb.cap=60;render();}
  else if(t.id==='sbkind'){ui.sb.kind=t.value;ui.sb.cap=60;render();}
  else if(t.id==='sblmin'){ui.sb.lmin=+t.value;if(ui.sb.lmax<ui.sb.lmin)ui.sb.lmax=ui.sb.lmin;render();}
  else if(t.id==='sblmax'){ui.sb.lmax=+t.value;if(ui.sb.lmin>ui.sb.lmax)ui.sb.lmin=ui.sb.lmax;render();}
  else if(t.id==='addmove'){ui.addM=t.value;render();}
  else if(t.id==='addkind'){ui.addK=t.value;render();}
  else if(t.id==='addtrait'){ui.addT=t.value;render();}
  else if(t.dataset.tname||t.dataset.tcolor)render();
});
document.addEventListener('click',ev=>{document.querySelectorAll('details.wmore[open],details.rmore[open],details.bmore[open]').forEach(m=>{if(!m.contains(ev.target)||ev.target.closest('.wpop button,.rpop button'))m.open=false;});});
document.addEventListener('click',ev=>{const m=document.getElementById('dataMenu');if(!m||!m.open)return;if(ev.target.closest('#dataMenu .pop button')||!ev.target.closest('#dataMenu'))m.open=false;});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(typeof DR!=='undefined'&&DR)endDrag(false);else if(D)closeModal();}});

$('#btnExport').onclick=()=>{const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download='exercise-library-'+new Date().toISOString().slice(0,10)+'.json';a.click();};
$('#btnImport').onclick=()=>$('#file').click();
$('#file').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());if(!j.exercises||!j.traits)throw 0;
    if(!confirm('Replace the current library with this file?'))return;
    S={traits:j.traits,exercises:j.exercises,workouts:j.workouts||[],templates:j.templates||[],plan:j.plan||{},meta:j.meta||{}};migrate();save();render();}
  catch(e){alert('That file is not a valid library export.');}ev.target.value='';};
$('#btnMerge').onclick=()=>{const n=mergeStarter();save();render();alert(n?`Added ${n} exercises. Your existing exercises were not changed.`:'Nothing new to add.');};
$('#btnOpen').onclick=()=>{if(!confirm('Add exercises from free-exercise-db (public domain)? Ones you already have are skipped, and nothing you have edited is changed.'))return;const a=mergeOpenDb();save();render();showAdded(a);};
$('#btnTbx').onclick=()=>{if(!confirm('Add the reviewed TeamBuildr exercises? Ones you already have are skipped and nothing you have edited changes.'))return;const a=mergeTbxNew();save();render();showAdded(a);};
$('#btnCov').onclick=showCoverage;
$('#btnLw').onclick=()=>lwStart();
$('#btnCmd').innerHTML=ic('search')+'<span class="kb"> Search</span>';$('#btnCmd').onclick=()=>cmdOpen();
$('#btnTour').onclick=()=>tourCard(0);
$('#btnSync').onclick=cloudSyncNow;
$('#btnReset').onclick=()=>{if(confirm('Replace everything with the starter set? This also replaces the cloud copy. Export first if you want a backup.')){S=seed();migrate();ui.wid=null;ui.sel={trait:'all',move:'all',phase:'all'};save();render();}};

/* theme: auto | light | dark */
let theme='auto';try{theme=localStorage.getItem('wp_theme')||'dark'}catch(e){}
function applyTheme(){const r=document.documentElement;theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',theme);
  $('#btnTheme').textContent='Theme: '+{auto:'◐ Auto',light:'☀ Light',dark:'☾ Dark'}[theme];try{localStorage.setItem('wp_theme',theme)}catch(e){}}
$('#btnTheme').onclick=()=>{theme={auto:'light',light:'dark',dark:'auto'}[theme];applyTheme();};
applyTheme();
gateThen(()=>{render();cloudLoad();maybeTour();});
</script>
</body>
</html>
